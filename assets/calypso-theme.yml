extends: default

page:
  margin: [1.0in, 0.67in, 0.67in, 0.67in]

font:
  catalog:
    Montserrat: &montserrat
      regular: Montserrat-Regular.ttf
      bold: Montserrat-Bold.ttf
      italic: Montserrat-Italic.ttf
      bold_italic: Montserrat-BoldItalic.ttf
    JetBrains Mono: &jetbrains
      regular: JetBrainsMono-Regular.ttf
      bold: JetBrainsMono-Bold.ttf
      italic: JetBrainsMono-Italic.ttf
      bold_italic: JetBrainsMono-BoldItalic.ttf
    "M+ 1mn": *jetbrains
    fallback: *montserrat

base:
  font-family: Montserrat
  font-size: 10.5
  font-color: #333333

role:
  color-calypso:
    font-color: #039efd

title_page:
  align: center
  logo:
    align: center
    image: image:logo.svg[pdfwidth=4.0in]
    top: 20%
  title:
    align: center
    font-color: #039efd
  authors:
    align: center
  revision:
    align: center

heading:
  font-color: #039efd
  font-style: normal

code:
  font-family: JetBrains Mono
  font-size: 8.5

link:
  font-color: #039efd
  text-decoration: underline

table:
  head:
    background-color: #f2f3f4
    border-bottom-width: 0.5

header:
  height: 0.8in
  border-color: #039efd
  border-width: 0.5
  padding: [16, 0, 4, 0]
  font-family: Montserrat
  font-size: 7
  font-color: #9d9d9d
  start-at: body
  recto: &header-content
    left:
      content: image:logo.svg[pdfwidth=1.5in]
      valign: center
    right:
      content: |
        SPECIFICATION +
        Public +
        {spec-name} +
        _{spec-ref}_
      valign: center
  verso: *header-content

footer:
  height: 0.4in
  border-color: #039efd
  border-width: 0.5
  padding: [4, 0, 4, 0]
  font-family: Montserrat
  font-size: 7
  font-color: #9d9d9d
  start-at: body
  recto: &footer-content
    left:
      content: |
        Version {nbsp} {spec-version} +
        Date {nbsp}{nbsp}{nbsp}{nbsp}{nbsp}{nbsp} {revdate}
      valign: center
    right:
      content: |
        [.color-calypso]#{page-number} / {page-count}# +
        _© Calypso Networks Association 2026 -- Reproduction is prohibited without prior written agreement_
      valign: center
  verso: *footer-content